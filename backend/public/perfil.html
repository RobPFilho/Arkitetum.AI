<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meu perfil | Arkitetum</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="nav">
    <a class="brand" href="/">ARKITETUM</a>
    <nav>
      <a href="dashboard.html">Painel</a>
      <a class="profile-icon-link" id="profile-icon-link" href="perfil.html" aria-label="Meu perfil">
        <span class="profile-icon-avatar" id="profile-icon-avatar">CS</span>
      </a>
      <button class="link-button" id="logout">Sair</button>
    </nav>
  </header>
  <main class="register-page profile-page">
    <section class="register-steps">
      <div class="register-step">
        <span class="register-step-title">Minha conta</span>
        <span class="register-step-text">Dados pessoais</span>
      </div>
      <div class="register-step">
        <span class="register-step-title">Arquivo</span>
        <span class="register-step-text">Preferências e materiais</span>
      </div>
      <div class="register-step">
        <span class="register-step-title">Resumo</span>
        <span class="register-step-text">Perfil atualizado</span>
      </div>
    </section>

    <div class="register-grid">
      <section class="register-panel">
        <div class="register-panel-head">
          <div>
            <p class="eyebrow">MINHA CONTA</p>
            <h1>Editar perfil</h1>
          </div>
          <span class="register-panel-icon">✦</span>
        </div>
        <form id="profile-form" class="register-form">
          <div class="form-row">
            <label for="name">Nome completo</label>
            <input id="name" name="name" placeholder="Nome completo" required />
          </div>
          <div class="form-inline-fields">
            <div class="form-row">
              <label for="phone">Telefone</label>
              <input id="phone" name="phone" placeholder="Telefone" />
            </div>
            <div class="form-row">
              <label for="city">Cidade</label>
              <input id="city" name="city" placeholder="Cidade" />
            </div>
          </div>
          <div class="form-inline-fields">
            <div class="form-row">
              <label for="state">Estado</label>
              <input id="state" name="state" placeholder="Estado" />
            </div>
          </div>
          <div id="profile-fields"></div>
          <button class="submit-button">Salvar alterações</button>
        </form>
        <p id="notice"></p>
      </section>
      <aside class="register-panel register-preview">
        <div class="register-preview-card">
          <span class="preview-label">Perfil</span>
          <div class="preview-materials">
            <span class="swatch swatch-1"></span>
            <span class="swatch swatch-2"></span>
            <span class="swatch swatch-3"></span>
          </div>
          <div class="preview-option">Informações pessoais e materiais</div>
          <div class="summary-list">
            <div><span>Perfil</span><strong>Em atualização</strong></div>
            <div><span>País</span><strong>Brasil</strong></div>
          </div>
        </div>
      </aside>
    </div>
  </main>
  <script src="site.js"></script>
</body>

</html>
