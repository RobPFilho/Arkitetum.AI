<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mansão Contemporânea — Estudo Volumétrico 3D</title>
<script type="importmap">
{
  "imports": {

    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #e9e6df; font-family: Georgia, serif; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { width: 100vw; height: 100vh; display: block; }
  #label {
    position: fixed; top: 18px; left: 24px; z-index: 5;
    color: #2b2a27; font-family: Georgia, 'Times New Roman', serif;
    pointer-events: none;
  }
  #label h1 { font-size: 20px; font-weight: 500; margin: 0 0 2px 0; letter-spacing: 0.02em; }
  #label p { font-size: 13px; margin: 0; opacity: 0.65; }
</style>
</head>
<body>
<div id="label">
  <h1>Residência Cantiléver — Estudo Volumétrico</h1>
  <p>Mansão contemporânea · concreto, madeira e vidro · modelo para portfólio</p>
</div>
<three-d-stage name="mansao-contemporanea" background="#e9e6df"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';

const stage = document.querySelector('three-d-stage');
const { THREE: T } = await stage.ready;

const house = new THREE.Group();
house.name = 'MansaoContemporanea';

// ---------- Materials (curated architectural palette) ----------
const mat = {
  stone: new T.MeshStandardMaterial({ name: 'travertino_claro', color: 0xd8d2c4, roughness: 0.88, metalness: 0.0 }),
  wood: new T.MeshStandardMaterial({ name: 'madeira_ripada', color: 0x6b4a30, roughness: 0.55, metalness: 0.0 }),
  glass: new T.MeshPhysicalMaterial({ name: 'vidro_temperado', color: 0xbfd6dd, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.32, transmission: 0.4, reflectivity: 0.6 }),
  plaster: new T.MeshStandardMaterial({ name: 'reboco_off_white', color: 0xefece3, roughness: 0.82, metalness: 0.0 }),
  metal: new T.MeshStandardMaterial({ name: 'metal_grafite', color: 0x2b2b2c, roughness: 0.4, metalness: 0.35 }),
  water: new T.MeshPhysicalMaterial({ name: 'agua_piscina', color: 0x2f7f86, roughness: 0.08, metalness: 0.05, transparent: true, opacity: 0.82 }),
  green: new T.MeshStandardMaterial({ name: 'vegetacao', color: 0x4a5c3a, roughness: 0.95, metalness: 0.0 }),
  jointDark: new T.MeshStandardMaterial({ name: 'junta_sombra', color: 0x8f8878, roughness: 0.95, metalness: 0.0 }),
  grass: new T.MeshStandardMaterial({ name: 'gramado', color: 0x5c7a3f, roughness: 1.0, metalness: 0.0 }),
  greenDark: new T.MeshStandardMaterial({ name: 'vegetacao_sombra', color: 0x38492b, roughness: 1.0, metalness: 0.0 }),
  greenLight: new T.MeshStandardMaterial({ name: 'vegetacao_luz', color: 0x6a8049, roughness: 0.9, metalness: 0.0 }),
  bark: new T.MeshStandardMaterial({ name: 'casca_arvore', color: 0x4a3524, roughness: 0.95, metalness: 0.0 }),
};

function box(w, h, d, material, name) {
  const m = new T.Mesh(new T.BoxGeometry(w, h, d), material);
  m.name = name;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ---------- Lawn ----------
const lawn = new T.Mesh(new T.PlaneGeometry(46, 34), mat.grass);
lawn.name = 'gramado_jardim';
lawn.rotation.x = -Math.PI / 2;
lawn.position.set(1, -0.16, 1);
lawn.receiveShadow = true;
house.add(lawn);

// ---------- Podium / base slab ----------
const podium = box(24.4, 0.3, 15.4, mat.stone, 'podio_base');
podium.position.set(0, -0.15, 0);
house.add(podium);

// ---------- Ground floor volume (stone-clad plinth) ----------
const groundFloor = box(22, 3.6, 13, mat.stone, 'volume_terreo');
groundFloor.position.set(0, 1.8, 0);
house.add(groundFloor);

// front glazing (south facade, facing the pool terrace)
const frontGlass = box(20.6, 3.1, 0.08, mat.glass, 'vidraca_fachada_sul');
frontGlass.position.set(0, 1.85, 6.56);
house.add(frontGlass);

// concrete plaster band wrapping the rear (north) of ground floor
const rearPlaster = box(22.05, 3.6, 0.1, mat.plaster, 'reboco_fachada_norte');
rearPlaster.position.set(0, 1.8, -6.56);
house.add(rearPlaster);

// garage door, recessed on the north (entrance/service) face
const garageDoor = box(5, 2.4, 0.1, mat.metal, 'portao_garagem');
garageDoor.position.set(-7.5, 1.4, -6.58);
house.add(garageDoor);

// ---------- Circulation / stair tower ----------
const tower = box(3, 8, 3, mat.stone, 'torre_circulacao');
tower.position.set(8.2, 4, -3.2);
house.add(tower);
const towerSlit = box(0.4, 5.5, 3.05, mat.glass, 'vidro_fresta_torre');
towerSlit.position.set(9.65, 4.4, -3.2);
house.add(towerSlit);

// ---------- Second floor volume (cantilevered, wood-clad) ----------
const upperFloor = box(16, 3.4, 9, mat.wood, 'volume_superior_cantilever');
upperFloor.position.set(-1, 5.3, 4.0);
house.add(upperFloor);

// punched window band on the cantilevered front face
const upperGlassBand = box(14.6, 2.1, 0.08, mat.glass, 'vidraca_pavimento_superior');
upperGlassBand.position.set(-1, 5.3, 8.55);
house.add(upperGlassBand);

// ---------- Roof slab ----------
const roof = box(17, 0.4, 9.8, mat.plaster, 'laje_cobertura');
roof.position.set(-1, 7.2, 4.0);
house.add(roof);
function roofEdgeRing(cx, cz, w, d, y, name) {
  const t = 0.16;
  house.add((() => { const b = box(w + t, 0.22, t, mat.metal, name + '_sul'); b.position.set(cx, y, cz + d / 2); return b; })());
  house.add((() => { const b = box(w + t, 0.22, t, mat.metal, name + '_norte'); b.position.set(cx, y, cz - d / 2); return b; })());
  house.add((() => { const b = box(t, 0.22, d + t, mat.metal, name + '_leste'); b.position.set(cx + w / 2, y, cz); return b; })());
  house.add((() => { const b = box(t, 0.22, d + t, mat.metal, name + '_oeste'); b.position.set(cx - w / 2, y, cz); return b; })());
}
roofEdgeRing(-1, 4.0, 17, 9.8, 7.03, 'testeira_cobertura');

// ---------- Window mullions (curtain wall framing) ----------
function glassMullions(cx, cy, cz, width, height, cols, rows, name) {
  const group = new T.Group();
  group.name = name;
  for (let i = 1; i < cols; i++) {
    const bar = box(0.06, height, 0.05, mat.metal, name + '_montante_' + i);
    bar.position.set(cx - width / 2 + (width / cols) * i, cy, cz + 0.05);
    group.add(bar);
  }
  for (let j = 1; j < rows; j++) {
    const bar = box(width, 0.06, 0.05, mat.metal, name + '_travessa_' + j);
    bar.position.set(cx, cy - height / 2 + (height / rows) * j, cz + 0.05);
    group.add(bar);
  }
  const frame1 = box(width + 0.08, 0.08, 0.06, mat.metal, name + '_verga');
  frame1.position.set(cx, cy + height / 2, cz + 0.05);
  group.add(frame1);
  const frame2 = box(width + 0.08, 0.08, 0.06, mat.metal, name + '_soleira');
  frame2.position.set(cx, cy - height / 2, cz + 0.05);
  group.add(frame2);
  house.add(group);
}
glassMullions(0, 1.85, 6.56, 20.6, 3.1, 8, 2, 'esquadria_terreo');
glassMullions(-1, 5.3, 8.55, 14.6, 2.1, 6, 1, 'esquadria_superior');

// ---------- Stone coursing joints (plinth reveals) ----------
function stoneCourses(x, name) {
  for (let i = 1; i <= 3; i++) {
    const line = box(0.03, 0.02, 13.02, mat.jointDark, name + '_junta_' + i);
    line.position.set(x, i * 0.85, 0);
    house.add(line);
  }
}
stoneCourses(11.02, 'pedra_leste');
stoneCourses(-11.02, 'pedra_oeste');

// ---------- Wood board reveals on upper volume flanks ----------
function woodReveals(x, name) {
  for (let i = 0; i < 10; i++) {
    const z = -0.4 + i * 0.95;
    const groove = box(0.025, 3.36, 0.02, mat.jointDark, name + '_ripa_' + i);
    groove.position.set(x, 5.3, z);
    house.add(groove);
  }
}
woodReveals(7.02, 'madeira_leste');
woodReveals(-9.02, 'madeira_oeste');

// ---------- Entrance: door, canopy, landing ----------
const entryDoor = box(1.5, 2.4, 0.09, mat.metal, 'porta_entrada_pivotante');
entryDoor.position.set(-2.2, 1.4, -6.58);
house.add(entryDoor);
const entryCanopy = box(3.2, 0.14, 1.9, mat.plaster, 'marquise_entrada');
entryCanopy.position.set(-2.2, 3.55, -7.35);
house.add(entryCanopy);
const entryLanding = box(3.4, 0.1, 1.6, mat.stone, 'patamar_entrada');
entryLanding.position.set(-2.2, 0.05, -7.3);
house.add(entryLanding);

// ---------- Window reveals (recessed jambs for real depth/shadow) ----------
function windowReveal(cx, cy, cz, width, height, name) {
  const top = box(width + 0.1, 0.1, 0.3, mat.plaster, name + '_verga');
  top.position.set(cx, cy + height / 2 + 0.05, cz - 0.1);
  house.add(top);
  const sill = box(width + 0.1, 0.08, 0.32, mat.stone, name + '_peitoril');
  sill.position.set(cx, cy - height / 2 - 0.04, cz - 0.08);
  house.add(sill);
}
windowReveal(0, 1.85, 6.56, 20.6, 3.1, 'janela_terreo');
windowReveal(-1, 5.3, 8.55, 14.6, 2.1, 'janela_superior');

// ---------- Roof detail: mechanical unit, vent, downspouts ----------
const acUnit = box(1.6, 0.55, 1.0, mat.metal, 'unidade_condensadora');
acUnit.position.set(4.5, 7.5, 2.5);
house.add(acUnit);
const vent = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 0.5, 12), mat.metal.clone());
vent.material.name = 'metal_grafite';
vent.name = 'duto_ventilacao';
vent.position.set(2.5, 7.45, 5.5);
vent.castShadow = true;
house.add(vent);
function downspout(x, z, name) {
  const d = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 6.9, 10), mat.metal.clone());
  d.material.name = 'metal_grafite';
  d.name = name;
  d.position.set(x, 3.45, z);
  d.castShadow = true;
  return d;
}
house.add(downspout(7.45, 8.35, 'rufo_pluvial_a'));
house.add(downspout(-9.45, 8.35, 'rufo_pluvial_b'));

// ---------- Cantilever support columns ----------
function column(x, z, name) {
  const c = new T.Mesh(new T.CylinderGeometry(0.22, 0.22, 3.6, 20), mat.metal.clone());
  c.material.name = 'metal_grafite';
  c.name = name;
  c.position.set(x, 1.8, z);
  c.castShadow = true;
  c.receiveShadow = true;
  return c;
}
house.add(column(-8.6, 8.2, 'pilar_cantilever_a'));
house.add(column(5.6, 8.2, 'pilar_cantilever_b'));

// ---------- Pergola / brise-soleil over the terrace ----------
const pergola = new T.Group();
pergola.name = 'pergola_brise_soleil';
const slatCount = 18;
const spanStart = -9.2, spanEnd = 6.6;
for (let i = 0; i < slatCount; i++) {
  const t = i / (slatCount - 1);
  const x = spanStart + (spanEnd - spanStart) * t;
  const slat = box(0.12, 0.12, 4.6, mat.wood, `ripa_pergola_${i + 1}`);
  slat.position.set(x, 3.85, 8.9);
  pergola.add(slat);
}
const pergolaBeam = box((spanEnd - spanStart) + 0.4, 0.18, 0.22, mat.wood, 'viga_pergola');
pergolaBeam.position.set((spanStart + spanEnd) / 2, 3.9, 6.7);
pergola.add(pergolaBeam);
house.add(pergola);

// ---------- Pool terrace deck ----------
const deck = box(14, 0.15, 9, mat.stone, 'deck_terraco');
deck.position.set(-0.5, -0.075, 11.5);
house.add(deck);

const pool = box(9, 0.1, 4.6, mat.water, 'espelho_dagua_piscina');
pool.position.set(-0.5, -0.06, 11.5);
house.add(pool);

const poolCoping = box(9.4, 0.06, 5.0, mat.stone, 'borda_piscina');
poolCoping.position.set(-0.5, -0.02, 11.5);
house.add(poolCoping);

// glass safety balustrade on the far edge of the terrace
const balustradeGlass = box(13.6, 1.0, 0.04, mat.glass, 'guarda_corpo_vidro');
balustradeGlass.position.set(-0.5, 0.5, 15.94);
house.add(balustradeGlass);
const balustradeRail = box(13.6, 0.05, 0.07, mat.metal, 'corrimao_metalico');
balustradeRail.position.set(-0.5, 1.0, 15.94);
house.add(balustradeRail);

// ---------- Driveway (north / service side) ----------
const driveway = box(5.5, 0.06, 8, mat.stone, 'via_acesso_garagem');
driveway.position.set(-7.5, 0.0, -11);
house.add(driveway);

// ---------- Boundary hedges & trees ----------
// clustered organic shrub — several overlapping spheres, varied tone and scale
function shrub(x, z, radius, name) {
  const g = new T.Group();
  g.name = name;
  const lumps = 4 + Math.floor(radius * 2);
  for (let i = 0; i < lumps; i++) {
    const ang = (i / lumps) * Math.PI * 2 + radius * 0.7;
    const r = radius * (0.55 + 0.35 * Math.sin(i * 2.1));
    const mset = [mat.green, mat.greenLight, mat.greenDark];
    const sphere = new T.Mesh(new T.SphereGeometry(r, 12, 10), mset[i % 3].clone());
    sphere.material.name = mset[i % 3].name;
    sphere.name = name + '_folhagem_' + i;
    sphere.position.set(Math.cos(ang) * radius * 0.4, r * 0.85 + 0.05, Math.sin(ang) * radius * 0.4);
    sphere.scale.set(1, 0.85, 1);
    sphere.castShadow = true;
    sphere.receiveShadow = true;
    g.add(sphere);
  }
  g.position.set(x, 0, z);
  return g;
}
function hedgeRow(x0, z0, x1, z1, count, name) {
  const g = new T.Group();
  g.name = name;
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    g.add(shrub(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t, 0.55, name + '_' + i));
  }
  house.add(g);
}
hedgeRow(-11.2, 12.6, -7.2, 12.6, 5, 'sebe_esquerda');
hedgeRow(2.6, 12.6, 6.6, 12.6, 5, 'sebe_direita');
hedgeRow(10.6, 1.2, 10.6, 4.8, 4, 'sebe_fundo_direita');
hedgeRow(-10.4, -5.2, -10.4, -1.4, 4, 'sebe_fundo_esquerda');
// low foundation planting hugging the stone plinth
hedgeRow(-9.5, 7.1, 9.5, 7.1, 9, 'canteiro_fundacao');

// tapered, branching tree with layered foliage clumps
function tree(x, z, scale, name) {
  const g = new T.Group();
  g.name = name;
  const trunkH = 2.6 * scale;
  const trunk = new T.Mesh(new T.CylinderGeometry(0.09 * scale, 0.22 * scale, trunkH, 12), mat.bark.clone());
  trunk.material.name = 'casca_arvore';
  trunk.name = name + '_tronco';
  trunk.position.set(0, trunkH / 2, 0);
  trunk.castShadow = true;
  g.add(trunk);
  const branchAngles = [0.6, 2.2, 3.6, 5.0];
  branchAngles.forEach((a, i) => {
    const len = 1.0 * scale;
    const branch = new T.Mesh(new T.CylinderGeometry(0.035 * scale, 0.07 * scale, len, 8), mat.bark.clone());
    branch.material.name = 'casca_arvore';
    branch.name = name + '_galho_' + i;
    branch.position.set(Math.cos(a) * len * 0.4, trunkH * 0.78 + i * 0.12 * scale, Math.sin(a) * len * 0.4);
    branch.rotation.z = Math.PI / 2.6 * Math.cos(a);
    branch.rotation.x = Math.PI / 2.6 * Math.sin(a);
    branch.castShadow = true;
    g.add(branch);
  });
  const mset = [mat.green, mat.greenLight, mat.greenDark];
  const clumps = 7;
  for (let i = 0; i < clumps; i++) {
    const a = (i / clumps) * Math.PI * 2;
    const r = 0.55 * scale + 0.25 * scale * Math.sin(i * 1.7);
    const cx = Math.cos(a) * 0.75 * scale;
    const cz = Math.sin(a) * 0.75 * scale;
    const cy = trunkH + 0.3 * scale + 0.4 * scale * Math.cos(i * 1.3);
    const clump = new T.Mesh(new T.SphereGeometry(r, 14, 12), mset[i % 3].clone());
    clump.material.name = mset[i % 3].name;
    clump.name = name + '_copa_' + i;
    clump.position.set(cx, cy, cz);
    clump.scale.set(1, 0.9, 1);
    clump.castShadow = true;
    clump.receiveShadow = true;
    g.add(clump);
  }
  const top = new T.Mesh(new T.SphereGeometry(0.7 * scale, 14, 12), mat.greenLight.clone());
  top.material.name = 'vegetacao_luz';
  top.name = name + '_copa_topo';
  top.position.set(0, trunkH + 0.9 * scale, 0);
  top.castShadow = true;
  g.add(top);
  g.position.set(x, 0, z);
  return g;
}
house.add(tree(-12.2, 9.8, 1.3, 'arvore_a'));
house.add(tree(11.6, 8.6, 1.1, 'arvore_b'));
house.add(tree(-13.0, -6.5, 0.9, 'arvore_c'));
house.add(tree(13.5, -9.5, 1.0, 'arvore_d'));
house.add(shrub(-6.5, 8.0, 0.4, 'arbusto_a'));
house.add(shrub(7.5, -6.0, 0.4, 'arbusto_b'));

// ---------- Driveway bollard lights ----------
function bollard(x, z, name) {
  const g = new T.Group();
  g.name = name;
  const post = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.6, 12), mat.metal.clone());
  post.material.name = 'metal_grafite';
  post.name = name + '_haste';
  post.position.set(0, 0.3, 0);
  post.castShadow = true;
  const cap = new T.Mesh(new T.CylinderGeometry(0.07, 0.07, 0.06, 12), mat.plaster.clone());
  cap.material.name = 'reboco_off_white';
  cap.name = name + '_topo';
  cap.position.set(0, 0.63, 0);
  g.add(post, cap);
  g.position.set(x, 0, z);
  return g;
}
house.add(bollard(-9.6, -8.5, 'balizador_a'));
house.add(bollard(-9.6, -11.5, 'balizador_b'));
house.add(bollard(-5.4, -8.5, 'balizador_c'));
house.add(bollard(-5.4, -11.5, 'balizador_d'));

// ---------- Center whole composition on origin, base at y=0 ----------
house.position.set(0, 0.15, -1.5);

stage.setObject(house);
</script>
</body>
</html>
